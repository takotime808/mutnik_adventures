<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boulder</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <style>
    .selected-container {
        text-align: center;
        margin-bottom: 1rem;
    }
    #selected-image {
        max-width: 25%;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .carousel {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    .carousel button {
        background: none;
        border: none;
        font-size: 2rem;
        cursor: pointer;
    }
    .thumbnails {
        display: flex;
        gap: 0.5rem;
    }
    .thumbnails img {
        width: 80px;
        height: auto;
        cursor: pointer;
        opacity: 0.6;
        border-radius: 4px;
        transition: opacity 0.3s, transform 0.3s, border 0.3s;
        border: 2px solid transparent;
    }
    .thumbnails img:hover {
        opacity: 1;
        transform: scale(1.05);
    }
    .thumbnails img.active {
        opacity: 1;
        border-color: #333;
    }
    </style>
</head>
<body>
    <h1>Boulder</h1>
    <div class="selected-container">
        <img id="selected-image" src="../../../images/dukes/Boulder/IMG_2956.JPG" alt="Boulder photo 1">
    </div>
    <div class="carousel">
        <button class="prev" aria-label="Previous image">&#10094;</button>
        <div class="thumbnails">
            <img src="../../../images/dukes/Boulder/IMG_2956.JPG" alt="Boulder photo 1" class="active">
            <img src="../../../images/dukes/Boulder/IMG_2958.JPG" alt="Boulder photo 2">
            <img src="../../../images/dukes/Boulder/IMG_2959.JPG" alt="Boulder photo 3">
        </div>
        <button class="next" aria-label="Next image">&#10095;</button>
    </div>
    <p><a href="../../../index.html">Back to map</a></p>
    <script>
    const thumbnails = document.querySelectorAll('.thumbnails img');
    const selectedImage = document.getElementById('selected-image');
    let currentIndex = 0;

    function showImage(index) {
        thumbnails[currentIndex].classList.remove('active');
        currentIndex = index;
        selectedImage.src = thumbnails[index].src;
        selectedImage.alt = thumbnails[index].alt;
        thumbnails[index].classList.add('active');
    }

    thumbnails.forEach((thumb, index) => {
        thumb.addEventListener('click', () => showImage(index));
    });

    document.querySelector('.prev').addEventListener('click', () => {
        showImage((currentIndex - 1 + thumbnails.length) % thumbnails.length);
    });

    document.querySelector('.next').addEventListener('click', () => {
        showImage((currentIndex + 1) % thumbnails.length);
    });
    </script>
</body>
</html>
