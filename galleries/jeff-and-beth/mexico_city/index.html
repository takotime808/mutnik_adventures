<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mexico City</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <style>
    /*-- -------------------------- -->
    <---          Gallery           -->
    <--- -------------------------- -*/

    /* Mobile - 360px */
    @media only screen and (min-width: 0rem) {
      #gallery-1897 {
        padding: var(--sectionPadding);
        background-color: #f6eddf;
        /* stops the cs-graphics from causing an overflow */
        overflow: hidden;
        position: relative;
      }
      #gallery-1897 .cs-container {
        width: 100%;
        max-width: 80rem;
        margin: auto;
        display: flex;
        flex-direction: column;
        /* 48px - 64px */
        gap: clamp(3rem, 6vw, 4rem);
        position: relative;
      }
      #gallery-1897 .cs-content {
        text-align: center;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: 1.5rem;
        z-index: 1;
      }
      #gallery-1897 .cs-title {
        max-width: 25ch;
        margin: 0;
      }
      #gallery-1897 .cs-button-solid {
        font-size: 1rem;
        font-weight: 700;
        /* 46px - 56px */
        line-height: clamp(2.875em, 5.5vw, 3.5em);
        text-align: center;
        text-decoration: none;
        min-width: 9.375rem;
        margin: 0;
        /* prevents padding from adding to the width */
        box-sizing: border-box;
        padding: 0 1.5rem;
        background-color: var(--secondary);
        overflow: hidden;
        color: #fff;
        border: none;
        border-radius: 0.25rem;
        display: inline-block;
        position: relative;
        z-index: 1;
        transition: color 0.3s;
      }
      #gallery-1897 .cs-button-solid:before {
        content: "";
        width: 0;
        height: 100%;
        background: #000;
        opacity: 1;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
        transition: width 0.3s;
      }
      #gallery-1897 .cs-button-solid:hover {
        color: #fff;
      }
      #gallery-1897 .cs-button-solid:hover:before {
        width: 100%;
      }
      #gallery-1897 .cs-gallery {
        width: 100%;
        display: grid;
        grid-auto-flow: row;
        /* 16px - 20px */
        gap: clamp(1rem, 2vw, 1.25rem);
        z-index: 1;
      }
      #gallery-1897 .cs-item {
        width: 100%;
        /* 16px - 32px */
        padding: clamp(1rem, 4vw, 2rem);
        background-color: #faf6f2;
        /* 16px - 32px */
        border-radius: 1rem;
        display: grid;
        /* 8px - 16px */
        column-gap: clamp(0.5rem, 2vw, 1rem);
        row-gap: 1rem;
      }
      #gallery-1897 .cs-item-text {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.2em;
        margin: 0;
        color: var(--headerColor);
        grid-column: span 2;
      }
      #gallery-1897 .cs-picture-group {
        /* 160px - 320px */
        min-height: clamp(10rem, 23vw, 20rem);
        overflow: hidden;
        border-radius: 1rem;
        grid-column: span 1;
        position: relative;
      }
      #gallery-1897 .cs-picture {
        width: 100%;
        height: 100%;
        display: block;
      }
      #gallery-1897 .cs-picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }
      #gallery-1897 .cs-tag {
        font-size: 0.875rem;
        line-height: 1.5em;
        padding: 0.25rem 0.75rem;
        background: rgba(0, 0, 0, 0.24);
        color: var(--bodyTextColorWhite);
        border: 1px solid var(--bodyTextColorWhite);
        border-radius: 1.875rem;
        position: absolute;
        /* 8px - 16px */
        bottom: clamp(0.5rem, 2vw, 1rem);
        left: clamp(0.5rem, 2vw, 1rem);
        backdrop-filter: blur(8px);
      }
      #gallery-1897 .cs-graphic {
        /* 500px - 835px */
        width: clamp(31.25rem, 60vw, 52.1875rem);
        /* 453px - 757px */
        height: clamp(28.3125rem, 55vw, 47.3125rem);
        object-fit: cover;
        position: absolute;
        z-index: 0;
      }
      #gallery-1897 .cs-graphic-top {
        top: 0;
        right: -8.875rem;
      }
      #gallery-1897 .cs-graphic-bottom {
        bottom: 0;
        left: 0;
      }
    }
    /* Tablet - 600px */
    @media only screen and (min-width: 37.5rem) {
      #gallery-1897 .cs-content {
        text-align: left;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
      }
      #gallery-1897 .cs-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
      #gallery-1897 .cs-graphic-top {
        right: -8.375rem;
        transform: initial;
      }
      #gallery-1897 .cs-graphic-bottom {
        left: -7.5rem;
        transform: initial;
      }
    }
    /* Desktop - 1600px */
    @media only screen and (min-width: 100rem) {
      #gallery-1897 .cs-graphic-top {
        margin-left: 15rem;
        left: 50%;
      }
      #gallery-1897 .cs-graphic-bottom {
        margin-right: 16.25rem;
        right: 50%;
        left: initial;
      }
    }
    /* Dark Mode */
    @media only screen and (min-width: 0rem) {
      body.dark-mode #gallery-1897 {
        background-color: var(--dark);
      }
      body.dark-mode #gallery-1897 .cs-title,
      body.dark-mode #gallery-1897 .cs-item-text {
        color: var(--bodyTextColorWhite);
      }
      body.dark-mode #gallery-1897 .cs-item {
        background-color: var(--medium);
      }
      body.dark-mode #gallery-1897 .cs-graphic {
        opacity: 0.05;
      }
    }
    </style>
</head>
<body>

                    </div>
                </li>
                <li class="cs-item">

                    <div class="cs-picture-group">
                        <picture class="cs-picture">
                            <img src="../../../images/dukes/Mexico City/Mexico City 3.webp" alt="Mexico City photo 3">
                        </picture>
                        <span class="cs-tag">Mexico City</span>
                    </div>
                </li>
            </ul>
        </div>
    </section>
</body>
</html>
