<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Paris, France</title>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.7.1/dist/leaflet.css' />
  <script src='https://unpkg.com/leaflet@1.7.1/dist/leaflet.js'></script>
  <style>
    #back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      color: #333;
      text-decoration: none;
      border: 1px solid #ccc;
      z-index: 1000;
    }

    /* Popup image layout (no default hiding) */
    .leaflet-popup-content img {
      display: block;
      max-width: 100%;
      height: auto;
      opacity: 1; /* always visible by default */
    }

    /* Apply fade-in only when JS marks image as loaded */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .leaflet-popup-content img.fade-in-loaded {
      animation: fadeIn 0.4s ease forwards;
    }
  </style>
</head>
<body>
  <a id='back-button' href='../../../index.html'>Back to globe</a>
  <div id='map' style='width:100%; height:100vh;'></div>
  <script>
    const map = L.map('map').setView([48.8566, 2.3522], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const purpleIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const base = [48.8566, 2.3522];
    const photos = [
      '../../../images/mel-and-carl/Paris/20240215_154753.webp',
      '../../../images/mel-and-carl/Paris/20240215_164359.webp',
      '../../../images/mel-and-carl/Paris/20240215_164920.webp',
      '../../../images/mel-and-carl/Paris/20240215_165434.webp',
      '../../../images/mel-and-carl/Paris/IMG-20240216-WA0018.webp'
    ].map((img, idx) => ({ coords: [base[0] + idx * 0.001, base[1]], img }));

    photos.forEach(p => {
      L.marker(p.coords, { icon: purpleIcon }).addTo(map)
        .bindPopup(`<img src="${p.img}" alt="Paris photo" style="max-width:200px;">`);
    });

    // Robust: ensure correct border sizing on first open + safe fade-in
    map.on('popupopen', (e) => {
      const el = e.popup.getElement();
      if (!el) return;

      const imgs = el.querySelectorAll('img');
      imgs.forEach((img) => {
        const reveal = () => {
          // Add fade-in animation class; keep image visible by default
          img.classList.add('fade-in-loaded');
          // Update popup size to match final image dimensions
          // Use rAF to ensure layout is ready before updating
          requestAnimationFrame(() => e.popup.update());
        };

        const onError = () => {
          // Hide broken image to avoid odd borders, but keep popup sane
          img.style.display = 'none';
          e.popup.update();
        };

        if (img.complete) {
          // If already loaded (cache), confirm it decoded before revealing
          if (img.naturalWidth > 0) {
            reveal();
          } else {
            // Edge case: 'complete' but zero size (failed decode) -> treat as error
            onError();
          }
        } else {
          img.addEventListener('load', reveal, { once: true });
          img.addEventListener('error', onError, { once: true });
        }
      });
    });
  </script>
</body>
</html>
