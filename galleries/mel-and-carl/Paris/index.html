<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Paris, France</title>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.7.1/dist/leaflet.css' />
  <script src='https://unpkg.com/leaflet@1.7.1/dist/leaflet.js'></script>
  <style>
    #back-button {
      position: absolute; top: 10px; left: 10px; background: #fff; padding: 6px 10px;
      border-radius: 4px; color: #333; text-decoration: none; border: 1px solid #ccc; z-index: 1000;
    }
    .leaflet-popup-content img {
      display: block;
      max-width: 100%;
      height: auto;
      opacity: 1;       /* visible by default */
      transition: none; /* fade-out stays fast/normal */
    }
    .leaflet-popup-content img.start-hidden { opacity: 0; }         /* initial no-transition hide */
    .leaflet-popup-content img.fade-in { transition: opacity 1.2s ease; } /* slow fade-in */
  </style>
</head>
<body>
  <a id='back-button' href='../../../index.html'>Back to globe</a>
  <div id='map' style='width:100%; height:100vh;'></div>
  <script>
    const map = L.map('map').setView([48.8566, 2.3522], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const purpleIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const base = [48.8566, 2.3522];
    const photos = [
      '../../../images/mel-and-carl/Paris/20240215_154753.webp',
      '../../../images/mel-and-carl/Paris/20240215_164359.webp',
      '../../../images/mel-and-carl/Paris/20240215_164920.webp',
      '../../../images/mel-and-carl/Paris/20240215_165434.webp',
      '../../../images/mel-and-carl/Paris/IMG-20240216-WA0018.webp'
    ].map((img, idx) => ({ coords: [base[0] + idx * 0.001, base[1]], img }));

    photos.forEach(p => {
      L.marker(p.coords, { icon: purpleIcon }).addTo(map)
        .bindPopup(`<img src="${p.img}" alt="Paris photo" style="max-width:200px;">`);
    });

    // Slow fade-in + correct first-open sizing, with cache/error fallback
    map.on('popupopen', (e) => {
      const el = e.popup.getElement();
      if (!el) return;
      const imgs = el.querySelectorAll('img');
      imgs.forEach((img) => {
        const update = () => e.popup.update();

        const startFade = () => {
          img.classList.add('start-hidden');
          requestAnimationFrame(() => {
            img.classList.add('fade-in');
            img.classList.remove('start-hidden');
          });
          requestAnimationFrame(update);
        };

        const showNoTransition = () => {
          img.classList.remove('start-hidden', 'fade-in');
          update();
        };

        const onError = () => {
          img.style.display = 'none';
          update();
        };

        if (img.complete && img.naturalWidth > 0) {
          startFade();
        } else {
          img.classList.add('start-hidden');
          const t = setTimeout(showNoTransition, 2500);
          img.addEventListener('load', () => { clearTimeout(t); startFade(); }, { once: true });
          img.addEventListener('error', () => { clearTimeout(t); onError(); }, { once: true });
        }
      });
    });
  </script>
</body>
</html>
