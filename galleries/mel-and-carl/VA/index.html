<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Virginia</title>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.7.1/dist/leaflet.css' />
  <script src='https://unpkg.com/leaflet@1.7.1/dist/leaflet.js'></script>
  <style>
    #back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      color: #333;
      text-decoration: none;
      border: 1px solid #ccc;
      z-index: 1000;
    }
    /* Popup images: layout + fade behavior */
    .leaflet-popup-content img {
      display: block;
      max-width: 100%;
      height: auto;
      opacity: 1;       /* visible by default */
      transition: none; /* fade-out remains fast/normal */
    }
    /* Start hidden (no transition), then we enable slow fade-in via JS */
    .leaflet-popup-content img.start-hidden { opacity: 0; }
    /* Slow fade-in only when ready */
    .leaflet-popup-content img.fade-in { transition: opacity 1.2s ease; }
  </style>
</head>
<body>
  <a id='back-button' href='../../../index.html'>Back to Globe</a>
  <div id='map' style='width:100%; height:100vh;'></div>
  <script>
    const map = L.map('map').setView([37.4316, -78.6569], 8.25);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const purpleIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const base = [37.4316, -78.6569];
    const photos = [
      '../../../images/mel-and-carl/VA/20210807_154039.webp',
      '../../../images/mel-and-carl/VA/20210807_154933.webp',
      '../../../images/mel-and-carl/VA/20210808_100726.webp',
      '../../../images/mel-and-carl/VA/20210808_104643.webp',
      '../../../images/mel-and-carl/VA/20210808_105120.webp'
    ].map((img, idx) => ({ coords: [base[0] + idx * 0.01, base[1]], img }));

    photos.forEach(p => {
      L.marker(p.coords, { icon: purpleIcon }).addTo(map)
        .bindPopup(`<img src="${p.img}" alt="Virginia photo" style="max-width:200px;">`);
    });

    // Slow fade-in on first open + correct border sizing, with robust fallbacks
    map.on('popupopen', (e) => {
      const el = e.popup.getElement();
      if (!el) return;

      const imgs = el.querySelectorAll('img');
      imgs.forEach((img) => {
        const update = () => e.popup.update();

        const startFade = () => {
          // Start hidden without transition, then enable slow fade-in
          img.classList.add('start-hidden');
          requestAnimationFrame(() => {
            img.classList.add('fade-in');
            img.classList.remove('start-hidden'); // triggers the slow fade-in
          });
          requestAnimationFrame(update); // recalc popup size after layout
        };

        const showNoTransition = () => {
          // Fallback: show immediately if load doesn't fire soon
          img.classList.remove('start-hidden', 'fade-in');
          update();
        };

        const onError = () => {
          // Hide broken image to prevent odd borders
          img.style.display = 'none';
          update();
        };

        if (img.complete) {
          if (img.naturalWidth > 0) {
            startFade();
          } else {
            onError(); // decoded to zero width → treat as error
          }
        } else {
          // Prepare hidden while loading; ensure it won't stay hidden forever
          img.classList.add('start-hidden');
          const t = setTimeout(showNoTransition, 2500);
          img.addEventListener('load', () => { clearTimeout(t); startFade(); }, { once: true });
          img.addEventListener('error', () => { clearTimeout(t); onError(); }, { once: true });
        }
      });
    });
  </script>
</body>
</html>
