<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>London, United Kingdom</title>
    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.7.1/dist/leaflet.css' />
    <script src='https://unpkg.com/leaflet@1.7.1/dist/leaflet.js'></script>
    <style>
        #back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            color: #333;
            text-decoration: none;
            border: 1px solid #ccc;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <a id='back-button' href='../../../index.html'>Back to globe</a>
    <div id='map' style='width:100%; height:100vh;'></div>
    <script>
        const map = L.map('map').setView([51.5074, -0.1278], 18);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        const purpleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        const photos = [
            { coords: [51.5074, -0.1278], img: '../../../images/mel-and-carl/London/IMG-20240208-WA0000.jpg' },
            { coords: [51.5084, -0.1278], img: '../../../images/mel-and-carl/London/IMG-20240209-WA0036.webp' },
            { coords: [51.5074, -0.1268], img: '../../../images/mel-and-carl/London/IMG-20240216-WA0013.webp' },
            { coords: [51.5064, -0.1278], img: '../../../images/mel-and-carl/London/20240209_124928.png' }
        ];
        photos.forEach(p => {
            L.marker(p.coords, { icon: purpleIcon }).addTo(map)
                .bindPopup(`<img src="${p.img}" style="max-width:200px;">`);
        });
    </script>
</body>
</html>
