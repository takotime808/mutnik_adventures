<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>North Carolina</title>
  <link rel='stylesheet' href='https://unpkg.com/leaflet@1.7.1/dist/leaflet.css' />
  <script src='https://unpkg.com/leaflet@1.7.1/dist/leaflet.js'></script>
  <style>
    #back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      color: #333;
      text-decoration: none;
      border: 1px solid #ccc;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <a id='back-button' href='../../../index.html'>Back to globe</a>
  <div id='map' style='width:100%; height:100vh;'></div>
  <script>
    const map = L.map('map').setView([35.7596, -79.0193], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const purpleIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });
    const base = [35.7596, -79.0193];
    const photos = [
      '../../../images/mel-and-carl/NC/20200827_105911.webp',
      '../../../images/mel-and-carl/NC/20200827_110803.webp',
      '../../../images/mel-and-carl/NC/20200829_152244.webp',
      '../../../images/mel-and-carl/NC/20200829_171835.webp',
      '../../../images/mel-and-carl/NC/20200829_184628.webp',
      '../../../images/mel-and-carl/NC/20200830_144125.webp',
      '../../../images/mel-and-carl/NC/20200904_182112.webp',
      '../../../images/mel-and-carl/NC/20200904_182516.webp',
      '../../../images/mel-and-carl/NC/20200905_142329.webp',
      '../../../images/mel-and-carl/NC/20200906_161753.webp'
    ].map((img, idx) => ({ coords: [base[0] + idx * 0.01, base[1]], img }));
    photos.forEach(p => {
      L.marker(p.coords, { icon: purpleIcon }).addTo(map)
        .bindPopup(`<img src="${p.img}" style="max-width:200px;">`);
    });
  </script>
</body>
</html>
