name: travel_map
description: "Mutnik Adventures – interactive travel photo map."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # WebView integration (used for iframe-style HTML embedding)
  webview_flutter: ^4.4.2

  # Optional: allows HTML parsing or manipulation within Dart if needed later
  html: ^0.15.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
