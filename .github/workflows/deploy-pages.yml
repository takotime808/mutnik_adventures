name: Deploy to GitHub Pages

on:
  push:
    branches:
      - docker-pwa   # deploy when this branch is updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you have a build step (e.g., Vite/Next), insert it here.
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - run: npm ci && npm run build
      # And then set the path below to your build output (e.g., "dist")

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # path to the static files (change to 'dist' if you build)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
